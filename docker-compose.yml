version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL} # Adjust for PostgreSQL connection string
    depends_on:
      - database

  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: bookclub_user
      POSTGRES_PASSWORD: bookclub_password
      POSTGRES_DB: bookclub_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data:
